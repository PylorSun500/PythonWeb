<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主页面</title>
</head>
<body>
    <h1>欢迎来到主页面</h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <p>你好，{{ session.get('username', '用户') }}！</p>
    <a href="{{ url_for('login') }}">返回登录</a>
</body>
</html>
