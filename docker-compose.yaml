services:
    mysql:
        image: mysql:8.0
        container_name: mysql-dev
        environment:
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_DATABASE: testdb
            MYSQL_USER: dev
            MYSQL_PASSWORD: dev123
        ports:
            - "3306:3306"              # 宿主机也可连接（DataGrip/DBeaver 等）
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:                    # 健康检查，确保 MySQL 就绪后才启动依赖服务
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 3s
            timeout: 5s
            retries: 10

    dev:
        build:
            context: .
            dockerfile: dockerfile
        container_name: flask-dev
        hostname: devbox
        depends_on:
            mysql:
                condition: service_healthy   # 等 MySQL 健康检查通过再启动
        ports:
            - "5001:5001"
        volumes:
            - .:/workspace
        working_dir: /workspace
        stdin_open: true
        tty: true
        environment:
            - PYTHONUNBUFFERED=1
            - PYTHONDONTWRITEBYTECODE=1
            - FLASK_ENV=development
            # PyMySQL 连接参数（容器内直接用服务名 "mysql" 作为 host）
            - MYSQL_HOST=mysql
            - MYSQL_PORT=3306
            - MYSQL_USER=dev
            - MYSQL_PASSWORD=dev123
            - MYSQL_DATABASE=testdb

    web:
        build:
            context: .
            dockerfile: dockerfile
        container_name: flask-web
        depends_on:
            mysql:
                condition: service_healthy
        ports:
            - "5001:5001"
        volumes:
            - .:/workspace
        working_dir: /workspace/Codes/flaskProject-test
        command: python app.py
        environment:
            - PYTHONUNBUFFERED=1
            - PYTHONDONTWRITEBYTECODE=1
            - MYSQL_HOST=mysql
            - MYSQL_PORT=3306
            - MYSQL_USER=dev
            - MYSQL_PASSWORD=dev123
            - MYSQL_DATABASE=testdb
        profiles:
            - web

volumes:
    mysql_data:
